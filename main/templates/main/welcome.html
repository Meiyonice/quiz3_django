<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ee;
            color: #20251f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .welcome-box {
            width: 100%;
            max-width: 850px;
            background: white;
            border: 1px solid #dedbd2;
            box-shadow: 0 10px 30px rgba(32, 37, 31, 0.06);
        }

        .header {
            padding: 18px 28px;
            border-bottom: 1px solid #e4e2dc;
        }

        .site-name {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .content {
            padding: 60px 55px;
        }

        .tag {
            display: inline-block;
            margin-bottom: 16px;
            color: #55715a;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: 43px;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .intro {
            max-width: 580px;
            margin: 20px 0 0;
            color: #697168;
            font-size: 15px;
            line-height: 1.7;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            padding: 12px 17px;
            background: #27362b;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #3b5140;
        }

        .button span {
            font-size: 17px;
        }

        .footer {
            border-top: 1px solid #e4e2dc;
            padding: 16px 28px;
            color: #7b8178;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .content {
                padding: 45px 28px;
            }

            h1 {
                font-size: 35px;
            }

            .header,
            .footer {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <div class="header">
            <div class="site-name">
                Student Directory
            </div>
        </div>

        <div class="content">
            <div class="tag">
                Hello
            </div>

            <h1>Welcome Po!</h1>

            <p class="intro">
                A simple student information system where you can
                view registered students and their basic academic information.
            </p>

            <a href="{% url 'home' %}" class="button">
                View Student Directory
                <span>→</span>
            </a>
        </div>

        <div class="footer">
            Marlon Ejay R. Ramirez • BSIT-3B
        </div>
    </div>
</body>
</html>
