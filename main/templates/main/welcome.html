<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #172033;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .welcome-box {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(23, 32, 51, 0.10);
        }

        .top-line {
            height: 7px;
            background: #0B2545;
        }

        .content {
            padding: 70px 80px 60px;
            text-align: center;
        }

        .tag {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #edf3ff;
            color: #315fba;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: -1px;
        }

        .intro {
            max-width: 600px;
            margin: 18px auto 0;
            color: #68758a;
            font-size: 16px;
            line-height: 1.7;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 32px;
            padding: 14px 24px;
            background: #0B2545;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #163A63;
            transform: translateY(-2px);
        }

        .footer {
            border-top: 1px solid #edf0f4;
            padding: 18px;
            text-align: center;
            color: #8a96a8;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .content {
                padding: 50px 25px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <div class="top-line"></div>
        <div class="content">
            <div class="tag">
                STUDENT DIRECTORY
            </div>
            <h1>Welcome Po!</h1>
            <p class="intro">
                A simple student information system where you can
                view registered students and their basic academic information.
            </p>
            <a href="{% url 'home' %}" class="button">
                View Student Directory
                <span>→</span>
            </a>
        </div>
        <div class="footer">
            Marlon Ejay R. Ramirez • BSIT-3B
        </div>
    </div>
</body>
</html>
